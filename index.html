<!DOCTYPE html>
<!--
  Meme Vote — team voting game (Host / Phone / TV), bilingual EN/AR with RTL support.
  Implemented from the Claude Design project "Meme Vote.dc.html".
  Built on the UAE Government Design System (AEGov DLS) colour + type tokens
  (https://designsystem.gov.ae). Self-contained: no build step, no framework —
  open directly or serve statically. Uses the repo's logo.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  /* AEGov DLS token subset used by this page (see designsystem.gov.ae) */
  :root{
    --primary:#92722A;        /* aegold-600 — AA-safe fill */
    --primary-hover:#7C5E24;  /* aegold-700 */
    --primary-subtle:#F9F7ED; /* aegold-50  */
    --ring:#CBA344;           /* aegold-400 */
    --fg-1:#232528; --fg-2:#4B4F58; --fg-3:#797E86;
    --border:#E1E3E5; --border-strong:#C3C6CB;
    --bg-page:#FCFCFC; --bg-surface:#FFFFFF; --bg-subtle:#F7F7F7;
    --success:#3F8E50;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg-page);color:var(--fg-1);font-family:'Roboto','Noto Kufi Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#92722A}a:hover{color:#7C5E24}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  @keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  /* hover/active helpers replacing the design's style-hover / style-active */
  .h-primary:hover{background:#7C5E24 !important}
  .tv-card{transition:transform .2s,box-shadow .2s}
  .tv-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px -6px rgba(14,15,18,.16);border-color:#CBA344 !important}
  .press:active{transform:scale(.98)}
  input[type=range]{accent-color:#92722A}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  var CONFIG = { showLiveCounts: true };

  // ------------------------------------------------------------------ state
  var state = {
    lang:'en', view:'host', screen:'landing', voteText:'', roundCount:8,
    roundIdx:0, votes:{}, votesIn:0, participants:0, totals:{}, wins:{},
    myVote:null, joined:false, qs:null, pIdx:0, pVotes:{}, history:{}, tvSel:null
  };

  // --------------------------------------------------------------- data/logic
  var App = {
    lobbyTick:null, sim:null, timer:null,

    COLORS: ['#043DFF','#D83731','#D67909','#3F8E50','#C026D3','#E54B1D','#0073AB','#92722A'],
    BASE: [
      { en: 'Who is most likely to have 100 browser tabs open?', ar: 'من الأكثر احتمالاً أن يفتح 100 تبويب في المتصفح؟', cap: 'Computer drowning in tabs' },
      { en: 'Which employee drinks the most tea?', ar: 'أكثر موظفة بتشرب شاي؟', cap: 'Someone hugging a giant teapot', arFirst: true },
      { en: "Who says 'I'll do it now'… and finishes it 3 days later?", ar: 'من يقول "الحين أسويها"… ويخلصها بعد 3 أيام؟', cap: 'Sloth at a desk' },
      { en: 'Who is the most short-tempered?', ar: 'أكثر موظفة عصبية؟', cap: 'Child holding a knife, unimpressed', arFirst: true },
      { en: 'Who replies to emails at 11pm?', ar: 'من يرد على الإيميلات الساعة 11 بالليل؟', cap: 'Owl staring at a laptop' },
      { en: 'Who is the calmest in the morning?', ar: 'أكثر موظفة رايقة الصبح؟', cap: 'Smiling baby, zero worries', arFirst: true },
      { en: 'Who is always first in the meeting room?', ar: 'من دائماً أول من يوصل قاعة الاجتماعات؟', cap: 'Dog waiting by the door' },
      { en: "Who says 'five minutes and I'm done'?", ar: 'أكثر موظف يقول "خمس دقايق وأخلص"؟', cap: 'Skeleton waiting at a desk', arFirst: true }
    ],
    EXTRA: ['Who has the loudest laugh?','Who never finds their parking spot?','Who brings the best snacks?','Who has the messiest desk?','Who is always on a call?','Who forgets to unmute?','Who plans the lunch orders?'],
    T: {
      en: { appName: 'Meme Vote', host: 'Host screen', phone: 'Phone', tv: 'TV home', tvKicker: 'Team wall', tvTitle: 'All memes and who the team picked', memesWord: 'memes', seeAll: 'See all votes', allMemes: 'All memes', otherLang: 'العربية', tagline: 'Team activity · no wrong answers', landingTitle: 'Vote for the colleague who matches the meme.', landingBody: 'Host shows a meme and a question on the big screen. Everyone types a name on their phone. Results, laughter, next meme.', createGame: 'Create a game', joinAsPlayer: 'Preview phone view', scanToJoin: 'Scan with your phone camera to join. No PIN, no sign‑in.', scannedIntro: 'You scanned the QR code on the big screen. Tap below to start voting.', scannedNote: 'Anonymous · no name or sign‑in needed', startVoting: 'Start voting', memeGoesHere: 'Meme image', sampleQ1: 'Who is most likely to have 100 browser tabs open?', sampleQ2: 'أكثر موظفة بتشرب شاي؟', step1: 'Set up', setupTitle: 'Names, rounds and memes', namesLabel: 'No name list needed', namesHelp: 'Each employee types a colleague’s name on their phone. The big screen shows the names as votes come in, and results rank the most‑voted names.', perRound: 'per round', namesComingIn: 'Names coming in', typeOnPhone: 'Everyone types a name on their phone', whoLabel: 'Who fits this meme?', typeName: 'Type a colleague’s name', submitVote: 'Submit vote', roundsLabel: 'Number of rounds', flowLabel: 'No timer', flowHelp: 'The round closes as soon as everyone has voted, or when you press "Show results". Then the next meme.', showResults: 'Show results', roundsPreview: 'Rounds', uploadMeme: 'Upload meme', round: 'Round', back: 'Back', openLobby: 'Open lobby', joinAt: 'Join at', gamePin: 'Game PIN', lobbyTitle: 'Waiting for the team to join', joined: 'joined', roundsWord: 'rounds', startGame: 'Start game', of: 'of', voted: 'voted', votes: 'votes', winsThisOne: 'wins this one!', leaderboard: 'Leaderboard', nextMeme: 'Next meme', showFinal: 'Final leaderboard', roundsWon: 'rounds won', continueGame: 'Continue game', newGame: 'New game', finalAfter: 'After round', finalDone: 'Game over', enterPin: 'Enter the PIN shown on the big screen.', nickname: 'Your nickname', join: 'Join', orScan: 'or scan the QR code', youreIn: "You're in", waitHost: 'Waiting for the host to start the first round.', simulateStart: 'Preview: host starts round', voteSubmitted: 'Vote submitted', youVotedFor: 'You voted for', waitingOthers: 'Waiting for everyone else…', roundsDone: 'rounds voted', allDone: 'All votes submitted', allVotesIn: 'every round voted', nextSoon: 'Next meme coming up', noVotesYet: 'No votes yet' },
      ar: { appName: 'تصويت الميمز', host: 'شاشة المقدّم', phone: 'الهاتف', tv: 'شاشة التلفاز', tvKicker: 'جدار الفريق', tvTitle: 'كل الميمز ومن اختارهم الفريق', memesWord: 'ميمز', seeAll: 'عرض كل الأصوات', allMemes: 'كل الميمز', otherLang: 'English', tagline: 'نشاط جماعي · لا توجد إجابات خاطئة', landingTitle: 'صوّت للزميل الذي يشبه الميم.', landingBody: 'يعرض المقدّم ميماً وسؤالاً على الشاشة الكبيرة. يكتب الجميع اسماً على هواتفهم. نتائج، ضحك، ثم الميم التالي.', createGame: 'إنشاء لعبة', joinAsPlayer: 'معاينة شاشة الهاتف', scanToJoin: 'امسح الرمز بكاميرا هاتفك للانضمام. بدون رمز أو تسجيل دخول.', scannedIntro: 'مسحت رمز QR على الشاشة الكبيرة. اضغط أدناه لبدء التصويت.', scannedNote: 'مجهول · بدون اسم أو تسجيل دخول', startVoting: 'ابدأ التصويت', memeGoesHere: 'صورة الميم', sampleQ1: 'Who is most likely to have 100 browser tabs open?', sampleQ2: 'أكثر موظفة بتشرب شاي؟', step1: 'الإعداد', setupTitle: 'الأسماء والجولات والميمز', namesLabel: 'لا حاجة لقائمة أسماء', namesHelp: 'يكتب كل موظف اسم زميل على هاتفه. تعرض الشاشة الكبيرة الأسماء مع وصول الأصوات، وترتّب النتائج الأسماء الأكثر تصويتاً.', perRound: 'لكل جولة', namesComingIn: 'الأسماء تصل الآن', typeOnPhone: 'الجميع يكتب اسماً على هاتفه', whoLabel: 'من يشبه هذا الميم؟', typeName: 'اكتب اسم زميل', submitVote: 'إرسال الصوت', roundsLabel: 'عدد الجولات', flowLabel: 'بدون مؤقّت', flowHelp: 'تُغلق الجولة فور تصويت الجميع، أو عند ضغط "عرض النتائج". ثم الميم التالي.', showResults: 'عرض النتائج', roundsPreview: 'الجولات', uploadMeme: 'رفع ميم', round: 'الجولة', back: 'رجوع', openLobby: 'فتح غرفة الانتظار', joinAt: 'انضم عبر', gamePin: 'رمز اللعبة', lobbyTitle: 'ننتظر انضمام الفريق', joined: 'انضموا', roundsWord: 'جولات', startGame: 'ابدأ اللعبة', of: 'من', voted: 'صوّتوا', votes: 'أصوات', winsThisOne: 'الفائز في هذه الجولة!', leaderboard: 'لوحة المتصدرين', nextMeme: 'الميم التالي', showFinal: 'اللوحة النهائية', roundsWon: 'جولات فاز بها', continueGame: 'متابعة اللعبة', newGame: 'لعبة جديدة', finalAfter: 'بعد الجولة', finalDone: 'انتهت اللعبة', enterPin: 'أدخل الرمز الظاهر على الشاشة الكبيرة.', nickname: 'اسمك المستعار', join: 'انضمام', orScan: 'أو امسح رمز QR', youreIn: 'انضممت', waitHost: 'ننتظر المقدّم ليبدأ الجولة الأولى.', simulateStart: 'معاينة: المقدّم يبدأ الجولة', voteSubmitted: 'تم إرسال صوتك', youVotedFor: 'صوّتت لـ', waitingOthers: 'ننتظر بقية الفريق…', roundsDone: 'جولات تم التصويت فيها', allDone: 'تم إرسال جميع أصواتك', allVotesIn: 'صوّتت في كل الجولات', nextSoon: 'الميم التالي قريباً', noVotesYet: 'لا أصوات بعد' }
    },
    POOL: ['Ali', 'Khawla', 'Maitha', 'Ayoub', 'Hana', 'Mohammed'],

    names: function(){ return App.sorted(state.votes).map(function(e){ return e[0]; }); },
    colorOf: function(n){ var h=0; for(var i=0;i<n.length;i++){ h=(h*31 + n.charCodeAt(i))>>>0; } return App.COLORS[h % App.COLORS.length]; },
    norm: function(n){ n=(n||'').trim().replace(/\s+/g,' '); return n ? n[0].toUpperCase()+n.slice(1) : ''; },
    rounds: function(){
      var n=state.roundCount, out=[];
      for(var i=0;i<n;i++){
        var b=App.BASE[i % App.BASE.length];
        var custom = state.qs && state.qs[i];
        out.push({ en: i<App.BASE.length ? b.en : App.EXTRA[(i-App.BASE.length) % App.EXTRA.length], ar: b.ar, cap: b.cap, arFirst: b.arFirst, custom: custom });
      }
      return out;
    },
    qText: function(r){ if(r.custom) return r.custom; return (r.arFirst && state.lang==='en') ? r.ar : (state.lang==='ar' ? r.ar : r.en); },
    isArabic: function(s){ return /[؀-ۿ]/.test(s); },
    sorted: function(obj){ return Object.entries(obj).sort(function(a,b){ return b[1]-a[1]; }); },
    stopTimer: function(){ clearInterval(App.timer); clearInterval(App.sim); App.timer=App.sim=null; },

    goLobby: function(){
      setState({ screen:'lobby', participants:3 });
      clearInterval(App.lobbyTick);
      App.lobbyTick = setInterval(function(){
        if(state.participants>=24){ clearInterval(App.lobbyTick); return; }
        setState({ participants: state.participants+1 });
      }, 900);
    },
    startRound: function(idx){
      clearInterval(App.lobbyTick); App.stopTimer();
      var i = (idx==null) ? state.roundIdx : idx;
      var p = Math.max(state.participants, 12);
      setState({ screen:'round', roundIdx:i, participants:p, votes:{}, votesIn:0 });
      var names = App.POOL, fav = names[(i*7+3)%names.length], fav2 = names[(i*5+1)%names.length];
      App.sim = setInterval(function(){
        setState(function(s){
          if(s.votesIn >= s.participants) return {};
          var r = Math.random();
          var who = r<0.42 ? fav : (r<0.65 ? fav2 : names[Math.floor(Math.random()*names.length)]);
          var votes = Object.assign({}, s.votes); votes[who] = (votes[who]||0)+1;
          return { votes: votes, votesIn: s.votesIn+1 };
        });
      }, 650);
      App.timer = setInterval(function(){ if(state.votesIn >= state.participants) setTimeout(function(){ App.finishRound(); }, 900); }, 500);
    },
    finishRound: function(){
      if(state.screen!=='round') return;
      App.stopTimer();
      var s=state, totals=Object.assign({}, s.totals), wins=Object.assign({}, s.wins);
      Object.entries(s.votes).forEach(function(e){ totals[e[0]] = (totals[e[0]]||0) + e[1]; });
      var w = App.sorted(s.votes)[0]; if(w) wins[w[0]] = (wins[w[0]]||0)+1;
      var history = Object.assign({}, s.history||{}); history[s.roundIdx] = s.votes;
      setState({ screen:'results', totals: totals, wins: wins, history: history });
    },
    nextRound: function(){
      var isLast = state.roundIdx >= state.roundCount-1;
      if(isLast) setState({ screen:'final' }); else App.startRound(state.roundIdx+1);
    },
    restart: function(){
      App.stopTimer(); clearInterval(App.lobbyTick);
      setState({ screen:'landing', roundIdx:0, totals:{}, wins:{}, votes:{}, votesIn:0, participants:0, myVote:null, joined:false, pIdx:0, pVotes:{}, history:{}, tvSel:null, voteText:'' });
    },
    joinGame: function(){ setState(function(s){ return { joined:true, participants: s.participants+1 }; }); },
    vote: function(name){
      name = App.norm(name||'');
      if(state.myVote || !name) return;
      setState(function(s){
        var pVotes = Object.assign({}, s.pVotes||{}); pVotes[s.pIdx||0] = name;
        var live = (s.pIdx||0)===s.roundIdx && s.screen==='round';
        var votes = s.votes;
        if(live){ votes = Object.assign({}, s.votes); votes[name] = (votes[name]||0)+1; }
        return {
          myVote: name, pVotes: pVotes, votes: votes,
          votesIn: live ? s.votesIn+1 : s.votesIn,
          participants: live ? Math.max(s.participants, s.votesIn+1) : s.participants,
          voteText: ''
        };
      });
    },
    pNext: function(){ setState(function(s){ return { pIdx:(s.pIdx||0)+1, myVote:null, voteText:'' }; }); },

    demoVotes: function(i){
      var v={}, seed=i*9301+49297, rnd=function(){ seed=(seed*9301+49297)%233280; return seed/233280; };
      var fav=App.POOL[(i*7+3)%App.POOL.length], fav2=App.POOL[(i*5+1)%App.POOL.length];
      for(var k=0;k<24;k++){ var r=rnd(); var who=r<0.42?fav:(r<0.65?fav2:App.POOL[Math.floor(rnd()*App.POOL.length)]); v[who]=(v[who]||0)+1; }
      return v;
    },
    roundSummary: function(i, votes, rounds){
      var r=rounds[i], q=App.qText(r), qAr=App.isArabic(q);
      var total=Math.max(1, Object.values(votes).reduce(function(a,b){ return a+b; }, 0));
      var all=App.sorted(votes).map(function(e,k){ return { rank:k+1, name:e[0], pct:Math.round(e[1]/total*100), color:App.colorOf(e[0]), weight:k===0?800:600 }; });
      return { n:i+1, q:q, qFont:qAr?"'Alexandria', sans-serif":"'Inter', sans-serif", qDir:qAr?'rtl':'ltr', cap:r.cap, total:total, all:all, top:all.slice(0,3), winner: all[0]?all[0].name:'' };
    },

    onVoteInput: function(e){
      state.voteText = e.target.value;
      var b=document.getElementById('submit-btn');
      if(b) b.style.background = state.voteText.trim() ? '#92722A' : '#C3C6CB';
    },
    onRoundsInput: function(e){
      state.roundCount = +e.target.value;
      var lab=document.getElementById('round-count-label'); if(lab) lab.textContent = state.roundCount;
      var pv=document.getElementById('rounds-preview'); if(pv) pv.innerHTML = roundsPreviewInner(App.renderVals());
    },

    renderVals: function(){
      var s=state, t=App.T[s.lang], ar=s.lang==='ar';
      var names=App.names(), rounds=App.rounds(), cur=rounds[s.roundIdx]||rounds[0];
      var question=App.qText(cur), qAr=App.isArabic(question);
      var colorOf=App.colorOf;
      var maxV=Math.max.apply(null, [1].concat(Object.values(s.votes)));
      var total=Math.max(1, Object.values(s.votes).reduce(function(a,b){ return a+b; }, 0));
      var sortedV=App.sorted(s.votes);
      var results=sortedV.map(function(e,i){ return { name:e[0], pct:Math.round(e[1]/total*100), color:colorOf(e[0]), weight:i===0?800:600 }; });
      var lb=App.sorted(s.totals).map(function(e,i){ return { rank:i+1, name:e[0], total:e[1], wins:s.wins[e[0]]||0, bg:i===0?'#F9F7ED':'#fff', border:i===0?'#CBA344':'#E1E3E5', rankColor:i===0?'#92722A':'#797E86' }; });
      var isLast=s.roundIdx >= s.roundCount-1;
      var pIdx=s.pIdx||0, pRound=rounds[Math.min(pIdx, rounds.length-1)], pQuestion=App.qText(pRound), pqAr=App.isArabic(pQuestion);
      var pDone = s.joined && s.screen!=='landing' && s.screen!=='setup' && s.screen!=='lobby' && pIdx>=s.roundCount;
      var pVotedThis = !!s.myVote;
      var hist=s.history||{}, played=Object.keys(hist).length>0;
      var tvCards=rounds.map(function(_, i){ return App.roundSummary(i, played ? (hist[i]||{}) : App.demoVotes(i), rounds); });
      var tvSel = s.tvSel!=null ? tvCards[s.tvSel] : null;
      return {
        t:t, ar:ar, dir: ar?'rtl':'ltr',
        fontBase: ar?"'Noto Kufi Arabic', sans-serif":"'Roboto', sans-serif",
        fontHead: ar?"'Alexandria', sans-serif":"'Inter', sans-serif",
        qFont: qAr?"'Alexandria', sans-serif":"'Inter', sans-serif", qDir: qAr?'rtl':'ltr',
        isHost:s.view==='host', isPhone:s.view==='phone', isTv:s.view==='tv',
        hostBg:s.view==='host'?'#92722A':'transparent', hostFg:s.view==='host'?'#fff':'#4B4F58',
        phoneBg:s.view==='phone'?'#92722A':'transparent', phoneFg:s.view==='phone'?'#fff':'#4B4F58',
        tvBg:s.view==='tv'?'#92722A':'transparent', tvFg:s.view==='tv'?'#fff':'#4B4F58',
        tvGrid:!tvSel, tvDetail:!!tvSel, tvCards:tvCards, tvSel: tvSel||{},
        isLanding:s.screen==='landing', isSetup:s.screen==='setup', isLobby:s.screen==='lobby', isRound:s.screen==='round', isResults:s.screen==='results', isFinal:s.screen==='final',
        roundCount:s.roundCount,
        setupRounds: rounds.map(function(r,i){ var q=App.qText(r); return { n:i+1, q:q, dir:App.isArabic(q)?'rtl':'ltr' }; }),
        participants:s.participants,
        lobbyChips: Array.from({length:s.participants}, function(_,i){ return App.COLORS[i%App.COLORS.length]; }),
        roundN:s.roundIdx+1, progressPct: Math.round((s.roundIdx+1)/s.roundCount*100)+'%', question:question, memeCaption:cur.cap, votesIn:s.votesIn,
        options: names.map(function(n){ return { name:n, color:colorOf(n), live:s.votes[n]||0, showLive: CONFIG.showLiveCounts, size: Math.round(22 + 18*(s.votes[n]||0)/maxV) }; }),
        voteText:s.voteText||'', submitBg:(s.voteText||'').trim()?'#92722A':'#C3C6CB',
        results:results, winner: results[0]?results[0].name:'', nextLabel: isLast?t.showFinal:t.nextMeme,
        leaderboard:lb, hasMoreRounds:!isLast,
        finalKicker: (isLast && s.screen==='final' && Object.keys(s.totals).length) ? t.finalDone : (t.finalAfter+' '+(s.roundIdx+1)),
        pJoin:!s.joined,
        pWaiting: s.joined && (s.screen==='landing'||s.screen==='setup'||s.screen==='lobby'),
        pVote: s.joined && (s.screen==='round'||s.screen==='results'||s.screen==='final') && !pDone && !pVotedThis,
        pSubmitted: s.joined && !pDone && pVotedThis && (s.screen==='round'||s.screen==='results'||s.screen==='final'),
        pDone:pDone, pResults:false,
        pRoundN:pIdx+1, pQuestion:pQuestion, pqFont:pqAr?"'Alexandria', sans-serif":"'Inter', sans-serif", pqDir:pqAr?'rtl':'ltr',
        pDots: Array.from({length:s.roundCount}, function(_,i){ return i<pIdx?'#92722A':(i===pIdx?'#CBA344':'#E1E3E5'); }),
        pProgress: (pIdx+1)+' '+t.of+' '+s.roundCount+' '+t.roundsDone,
        myVoteName:s.myVote||'', myVoteColor:s.myVote?colorOf(s.myVote):'#92722A'
      };
    }
  };

  // -------------------------------------------------------------------- utils
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function setState(patch){
    if(typeof patch==='function') patch=patch(state);
    Object.assign(state, patch);
    render();
  }

  // ------------------------------------------------------------------- markup
  function roundsPreviewInner(V){
    return V.setupRounds.map(function(r,i){
      return '<div style="background:#fff;border:1px solid #E1E3E5;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px">'

  function lobby(V){

  function roundScreen(V){

      + '<div style="display:flex;flex-direction:column;gap:20px">'
        + '<h3 style="margin:0;font-family:'+s.qFont+';font-weight:800;font-size:clamp(26px,3vw,40px);line-height:1.2" dir="'+s.qDir+'">'+esc(s.q)+'</h3>'
        + (s.winner
            ? '<div style="align-self:flex-start;display:flex;align-items:center;gap:12px;background:#F9F7ED;border:2px solid #CBA344;color:#5D3B26;border-radius:999px;padding:12px 24px;font-family:'+V.fontHead+';font-weight:800;font-size:24px"><i class="ph-fill ph-trophy" style="color:#92722A"></i>'+esc(s.winner)+' '+esc(V.t.winsThisOne)+'</div>'
            : '<div style="align-self:flex-start;display:flex;align-items:center;gap:10px;background:#F7F7F7;border:1px solid #E1E3E5;color:#4B4F58;border-radius:999px;padding:10px 22px;font-weight:600;font-size:20px"><i class="ph-bold ph-hourglass-medium"></i>'+esc(V.t.noVotesYet)+'</div>')
        + '<div style="display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid #E1E3E5;border-radius:16px;padding:22px">'+s.all.map(function(r){
            return '<div style="display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:14px">'
              + '<span style="font-family:'+V.fontHead+';font-weight:'+r.weight+';font-size:22px;text-align:end">'+esc(r.name)+'</span>'
              + '<div style="height:34px;background:#F7F7F7;border-radius:8px;overflow:hidden"><div style="height:100%;background:'+r.color+';border-radius:8px;width:'+r.pct+'%;transition:width .8s cubic-bezier(.2,.8,.2,1)"></div></div>'
              + '<span style="font-family:'+V.fontHead+';font-weight:800;font-size:22px">'+r.pct+'%</span>'
            + '</div>';
          }).join('')+'</div>'
      + '</div>'
    + '</div>';
  }

  function tvView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;gap:28px;max-width:1400px;width:100%;margin:0 auto;padding:36px 40px 48px;box-sizing:border-box;animation:popIn .4s ease">'
      + '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">'
        + '<div><div style="font-size:14px;font-weight:600;color:#92722A;letter-spacing:.06em;text-transform:uppercase">'+esc(V.t.tvKicker)+'</div><h2 style="margin:6px 0 0;font-family:'+V.fontHead+';font-weight:800;font-size:clamp(36px,4vw,56px);line-height:1.05">'+esc(V.t.tvTitle)+'</h2></div>'
        + '<div style="display:flex;gap:24px;font-size:18px;color:#4B4F58"><span style="display:flex;gap:8px;align-items:center"><i class="ph-bold ph-images" style="font-size:24px"></i>'+V.roundCount+' '+esc(V.t.memesWord)+'</span><span style="display:flex;gap:8px;align-items:center"><i class="ph-bold ph-users" style="font-size:24px"></i>'+V.participants+' '+esc(V.t.joined)+'</span></div>'
      + '</div>'
      + (V.tvGrid ? tvGridView(V) : '')
      + (V.tvDetail ? tvDetailView(V) : '')
    + '</div>';
  }

  function phoneView(V){
    return '<div style="flex:1;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;background:#F2F2F2">'
      + '<div style="width:390px;max-width:100%;min-height:760px;background:#FCFCFC;border-radius:40px;border:10px solid #232528;box-shadow:0 24px 48px -12px rgba(14,15,18,.3);overflow:hidden;display:flex;flex-direction:column">'
        + '<div style="display:flex;justify-content:space-between;padding:12px 22px 0;font-size:14px;font-weight:600"><span>9:41</span><span style="display:flex;gap:6px"><i class="ph-bold ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>'
        + '<div style="flex:1;display:flex;flex-direction:column;padding:20px;gap:18px">'
          + (V.pJoin ? pJoinView(V) : '')
          + (V.pWaiting ? pWaitingView(V) : '')
          + (V.pVote ? pVoteView(V) : '')
          + (V.pSubmitted ? pSubmittedView(V) : '')
          + (V.pDone ? pDoneView(V) : '')
          + (V.pResults ? pResultsView(V) : '')
        + '</div>'
      + '</div>'
    + '</div>';
  }

  function pJoinView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;animation:popIn .4s ease">'
      + '<img src="logo.png" alt="" style="height:44px;align-self:flex-start">'
      + '<h2 style="margin:0;font-family:'+V.fontHead+';font-weight:800;font-size:34px;line-height:1.1">'+esc(V.t.appName)+'</h2>'
      + '<p style="margin:0;color:#4B4F58;font-size:16px;line-height:1.5">'+esc(V.t.scannedIntro)+'</p>'
      + '<div style="display:flex;gap:10px;align-items:center;background:#F9F7ED;border-radius:12px;padding:14px;color:#5D3B26;font-size:14px;font-weight:600"><i class="ph-bold ph-qr-code" style="font-size:22px;color:#92722A"></i>'+esc(V.t.scannedNote)+'</div>'
      + '<button data-a="joinGame" class="h-primary" style="border:0;background:#92722A;color:#fff;font-size:20px;font-weight:700;padding:18px;border-radius:999px;min-height:56px;display:flex;justify-content:center;gap:10px;align-items:center"><i class="ph-bold ph-play"></i>'+esc(V.t.startVoting)+'</button>'
    + '</div>';
  }

  function pWaitingView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;animation:popIn .4s ease">'
      + '<div style="width:88px;height:88px;border-radius:50%;background:#F9F7ED;display:flex;align-items:center;justify-content:center"><i class="ph-fill ph-check-circle" style="font-size:52px;color:#3F8E50"></i></div>'
      + '<h3 style="margin:0;font-family:'+V.fontHead+';font-weight:800;font-size:28px">'+esc(V.t.youreIn)+'</h3>'
      + '<p style="margin:0;color:#4B4F58;font-size:16px">'+esc(V.t.waitHost)+'</p>'
      + '<button data-a="hostStartFromPhone" style="margin-top:8px;border:1px solid #C3C6CB;background:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;color:#4B4F58">'+esc(V.t.simulateStart)+'</button>'
    + '</div>';
  }

  function pVoteView(V){
    return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:#4B4F58"><span>'+esc(V.t.round)+' '+V.pRoundN+'/'+V.roundCount+'</span><div style="display:flex;gap:4px">'+V.pDots.map(function(d){ return '<span style="width:8px;height:8px;border-radius:50%;background:'+d+'"></span>'; }).join('')+'</div></div>'
      + '<div style="background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 12px -2px rgba(14,15,18,.1);display:flex;flex-direction:column;gap:10px">'
        + '<div style="height:120px;border-radius:8px;background:linear-gradient(135deg,#E1E3E5,#C3C6CB);display:flex;align-items:center;justify-content:center;color:#4B4F58"><i class="ph ph-image" style="font-size:36px"></i></div>'
        + '<div style="font-family:'+V.pqFont+';font-weight:800;font-size:18px;line-height:1.3" dir="'+V.pqDir+'">'+esc(V.pQuestion)+'</div>'
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:12px">'
        + '<label style="font-weight:700;font-size:16px">'+esc(V.t.whoLabel)+'</label>'
        + '<input value="'+esc(V.voteText)+'" data-input="onVoteInput" data-key="onVoteKey" data-focus="vote" placeholder="'+esc(V.t.typeName)+'" style="font:inherit;font-family:'+V.fontHead+';font-weight:800;font-size:24px;border:2px solid #C3C6CB;border-radius:12px;padding:16px;outline-color:#CBA344;background:#fff;min-height:56px;box-sizing:border-box">'
        + '<button id="submit-btn" data-a="submitVote" class="press" style="border:0;background:'+V.submitBg+';color:#fff;font-size:20px;font-weight:700;padding:18px;border-radius:999px;min-height:56px;display:flex;justify-content:center;gap:10px;align-items:center"><i class="ph-bold ph-paper-plane-tilt"></i>'+esc(V.t.submitVote)+'</button>'
      + '</div>';
  }

  function pSubmittedView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;animation:popIn .4s ease">'
      + '<div style="width:96px;height:96px;border-radius:50%;background:'+V.myVoteColor+';display:flex;align-items:center;justify-content:center;animation:bump .5s ease"><i class="ph-bold ph-check" style="font-size:48px;color:#fff"></i></div>'
      + '<h3 style="margin:0;font-family:'+V.fontHead+';font-weight:800;font-size:26px">'+esc(V.t.voteSubmitted)+'</h3>'
      + '<p style="margin:0;color:#4B4F58;font-size:16px">'+esc(V.t.youVotedFor)+' <strong>'+esc(V.myVoteName)+'</strong></p>'
      + '<p style="margin:0;color:#797E86;font-size:15px">'+esc(V.pProgress)+'</p>'
      + '<button data-a="pNext" class="h-primary" style="margin-top:8px;border:0;background:#92722A;color:#fff;font-size:18px;font-weight:700;padding:16px 28px;border-radius:999px;min-height:56px;display:flex;gap:10px;align-items:center">'+esc(V.t.nextMeme)+'<i class="ph-bold ph-arrow-right"></i></button>'
    + '</div>';
  }

  function pDoneView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;animation:popIn .4s ease">'
      + '<div style="width:96px;height:96px;border-radius:50%;background:#F9F7ED;display:flex;align-items:center;justify-content:center;animation:bump .5s ease"><i class="ph-fill ph-trophy" style="font-size:48px;color:#92722A"></i></div>'
      + '<h3 style="margin:0;font-family:'+V.fontHead+';font-weight:800;font-size:26px">'+esc(V.t.allDone)+'</h3>'
      + '<p style="margin:0;color:#4B4F58;font-size:16px">'+V.roundCount+' '+esc(V.t.roundsWord)+' · '+esc(V.t.allVotesIn)+'</p>'
      + '<p style="margin:0;color:#797E86;font-size:15px">'+esc(V.t.waitingOthers)+'</p>'
    + '</div>';
  }

  function pResultsView(V){
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:popIn .4s ease">'
      + (V.winner
          ? '<div style="align-self:center;display:flex;gap:8px;align-items:center;background:#F9F7ED;border:2px solid #CBA344;color:#5D3B26;border-radius:999px;padding:10px 18px;font-family:'+V.fontHead+';font-weight:800;font-size:18px"><i class="ph-fill ph-trophy" style="color:#92722A"></i>'+esc(V.winner)+' '+esc(V.t.winsThisOne)+'</div>'
          : '<div style="align-self:center;display:flex;gap:8px;align-items:center;background:#F7F7F7;border:1px solid #E1E3E5;color:#4B4F58;border-radius:999px;padding:10px 18px;font-weight:600;font-size:16px"><i class="ph-bold ph-hourglass-medium"></i>'+esc(V.t.noVotesYet)+'</div>')
      + V.results.map(function(r){ return '<div style="display:grid;grid-template-columns:90px 1fr 50px;align-items:center;gap:10px;font-size:15px"><span style="font-weight:700;text-align:end">'+esc(r.name)+'</span><div style="height:16px;background:#E1E3E5;border-radius:999px;overflow:hidden"><div style="height:100%;background:'+r.color+';width:'+r.pct+'%;transition:width .8s"></div></div><span style="font-weight:800">'+r.pct+'%</span></div>'; }).join('')
      + '<p style="margin:8px 0 0;text-align:center;color:#797E86;font-size:14px">'+esc(V.t.nextSoon)+'</p>'
    + '</div>';
  }

  function view(V){
    return '<div dir="'+V.dir+'" style="min-height:100vh;display:flex;flex-direction:column;font-family:'+V.fontBase+'">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid #E1E3E5">'
        + '<div style="display:flex;align-items:center;gap:14px"><img src="logo.png" alt="" style="height:40px"><div style="width:1px;height:28px;background:#E1E3E5"></div><div style="font-family:'+V.fontHead+';font-weight:800;font-size:18px;color:#92722A">'+esc(V.t.appName)+'</div></div>'
        + '<div style="display:flex;align-items:center;gap:8px">'
          + '<div style="display:flex;background:#F7F7F7;border-radius:999px;padding:3px">'
            + '<button data-a="setHost" style="border:0;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;background:'+V.hostBg+';color:'+V.hostFg+';display:flex;gap:6px;align-items:center"><i class="ph-bold ph-monitor"></i>'+esc(V.t.host)+'</button>'
            + '<button data-a="setPhone" style="border:0;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;background:'+V.phoneBg+';color:'+V.phoneFg+';display:flex;gap:6px;align-items:center"><i class="ph-bold ph-device-mobile"></i>'+esc(V.t.phone)+'</button>'
            + '<button data-a="setTv" style="border:0;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;background:'+V.tvBg+';color:'+V.tvFg+';display:flex;gap:6px;align-items:center"><i class="ph-bold ph-television"></i>'+esc(V.t.tv)+'</button>'
          + '</div>'
          + '<button data-a="toggleLang" style="border:1px solid #C3C6CB;background:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center"><i class="ph-bold ph-translate"></i>'+esc(V.t.otherLang)+'</button>'
        + '</div>'
      + '</div>'
      + (V.isHost ? hostView(V) : '')
      + (V.isTv ? tvView(V) : '')
      + (V.isPhone ? phoneView(V) : '')
    + '</div>';
  }

  // ------------------------------------------------------------------- render
  var root = document.getElementById('app');

  function render(){
    var V = App.renderVals();
    // preserve focus + caret across full re-render (e.g. while typing a vote)
    var active = document.activeElement, key=null, selS=null, selE=null;
    if(active && active.dataset && active.dataset.focus){
      key = active.dataset.focus;
      try{ selS=active.selectionStart; selE=active.selectionEnd; }catch(e){}
    }
    try { document.documentElement.lang = state.lang; document.documentElement.dir = V.dir; } catch (e) {}
    root.innerHTML = view(V);
    if(key){
      var el = root.querySelector('[data-focus="'+key+'"]');
      if(el){ el.focus(); try{ if(selS!=null) el.setSelectionRange(selS, selE); }catch(e){} }
    }
  }

  // --------------------------------------------------------------- dispatch
  var actions = {
    setHost:    function(){ setState({ view:'host' }); },
    setPhone:   function(){ setState({ view:'phone' }); },
    setTv:      function(){ setState({ view:'tv', tvSel:null }); },
    toggleLang: function(){ setState({ lang: state.lang==='ar' ? 'en' : 'ar' }); },
    goSetup:    function(){ setState({ screen:'setup' }); },
    goLanding:  function(){ setState({ screen:'landing' }); },
    goLobby:    function(){ App.goLobby(); },
    goFinal:    function(){ setState({ screen:'final' }); },
    startRound: function(){ App.startRound(0); },
    finishNow:  function(){ App.finishRound(); },
    nextRound:  function(){ App.nextRound(); },
    restart:    function(){ App.restart(); },
    joinGame:   function(){ App.joinGame(); },
    hostStartFromPhone: function(){ App.startRound(0); },
    submitVote: function(){ App.vote(state.voteText); },
    pNext:      function(){ App.pNext(); },
    tvBack:     function(){ setState({ tvSel:null }); },
    tvOpen:     function(ds){ setState({ tvSel: +ds.i }); },
    onQ:        function(ds, e){ setState(function(s){ var qs=Object.assign({}, s.qs||{}); qs[+ds.i]=e.target.value; return { qs:qs }; }); },
    onRoundsInput: function(ds, e){ App.onRoundsInput(e); },
    onVoteInput:   function(ds, e){ App.onVoteInput(e); },
    onVoteKey:     function(ds, e){ if(e.key==='Enter') App.vote(state.voteText); }
  };
  function run(name, ds, e){ if(actions[name]) actions[name](ds, e); }

  root.addEventListener('click', function(e){ var t=e.target.closest('[data-a]'); if(t) run(t.dataset.a, t.dataset, e); });
  root.addEventListener('input', function(e){ var t=e.target.closest('[data-input]'); if(t) run(t.dataset.input, t.dataset, e); });
  root.addEventListener('change', function(e){ var t=e.target.closest('[data-change]'); if(t) run(t.dataset.change, t.dataset, e); });
  root.addEventListener('keydown', function(e){ var t=e.target.closest('[data-key]'); if(t) run(t.dataset.key, t.dataset, e); });

  render();
})();
</script>
</body>
</html>
