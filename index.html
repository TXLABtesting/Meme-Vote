  Implemented from the Claude Design project "Meme Vote.dc.html", styled on the UAE
  Government Design System (AEGov DLS).

  room (short code + QR), players join from their phones, and votes aggregate live
  across devices. No build step, and no database tables/SQL required. Fill in

    }
    // final
    return phoneShell('<div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;animation:popIn .4s ease"><div style="width:96px;height:96px;border-radius:50%;background:#F9F7ED;display:flex;align-items:center;justify-content:center;animation:bump .5s ease"><i class="ph-fill ph-trophy" style="font-size:48px;color:#92722A"></i></div><h3 style="margin:0;font-family:'+f.head+';font-weight:800;font-size:26px">'+esc(t.allDone)+'</h3><p style="margin:0;color:#4B4F58;font-size:16px">'+esc(t.allVotesIn)+'</p></div>');
  }

  // ---- top-level view ------------------------------------------------------
  function notConfigured(t, f){
    return centerCard('<i class="ph ph-plugs" style="font-size:44px;color:#92722A"></i><h2 style="margin:14px 0 8px;font-family:'+f.head+';font-weight:800;font-size:26px">'+esc(t.notConfiguredTitle)+'</h2><p style="margin:0;color:#4B4F58;line-height:1.6">'+esc(t.notConfiguredBody)+'</p>');
  }
  function view(){
    var t=T[state.lang], f=fonts();
    var dir = state.lang==='ar'?'rtl':'ltr';
    var body;
    if(!state.configured){ body = notConfigured(t, f); }
    else if(state.connecting){ body = centerCard('<div class="spin"></div><p style="margin:14px 0 0;color:#4B4F58">'+esc(t.connecting)+'</p>'); }
    else if(state.view==='host'){ body = hostView(t, f); }
    else if(state.view==='tv'){ body = tvView(t, f); }
    else { body = phoneView(t, f); }
    return '<div dir="'+dir+'" style="min-height:100vh;display:flex;flex-direction:column;font-family:'+f.base+'">'+header(t,f)+body+'</div>';
  }

  // ------------------------------------------------------------------- render
  var root = document.getElementById('app');
  function render(){
    // play the round-start cue once per round, on the host screen only
    try{ var _m=meta(); if(state.view==='host' && _m && _m.status==='round'){ if(soundRoundKey!==_m.roundIdx){ soundRoundKey=_m.roundIdx; Sound.roundStart(); } } else if(!(_m && _m.status==='round')){ soundRoundKey=-1; } }catch(e){}
    var active=document.activeElement, key=null, selS=null, selE=null;
    if(active && active.dataset && active.dataset.focus){ key=active.dataset.focus; try{ selS=active.selectionStart; selE=active.selectionEnd; }catch(e){} }
    try{ document.documentElement.lang=state.lang; document.documentElement.dir=(state.lang==='ar'?'rtl':'ltr'); }catch(e){}
    root.innerHTML = view();
    if(key){ var el=root.querySelector('[data-focus="'+key+'"]'); if(el){ el.focus(); try{ if(selS!=null) el.setSelectionRange(selS,selE); }catch(e){} } }
    // real QR in the host lobby
    var qb=document.getElementById('qr-box');
    if(qb && state.code && typeof QRCode!=='undefined'){ try{ qb.innerHTML=''; new QRCode(qb, { text: joinURL(state.code), width:176, height:176, correctLevel: QRCode.CorrectLevel.M }); }catch(e){} }
  }

  // ---------------------------------------------------------------- dispatch
  function run(name, ds, e){ if(actions[name]) actions[name](ds, e); }
  root.addEventListener('click', function(e){ var t=e.target.closest('[data-a]'); if(t) run(t.dataset.a, t.dataset, e); });
  root.addEventListener('input', function(e){ var t=e.target.closest('[data-input]'); if(t) run(t.dataset.input, t.dataset, e); });
  root.addEventListener('change', function(e){ var t=e.target.closest('[data-change]'); if(t) run(t.dataset.change, t.dataset, e); });
  root.addEventListener('keydown', function(e){ var t=e.target.closest('[data-key]'); if(t) run(t.dataset.key, t.dataset, e); });

  // ------------------------------------------------------------------- backend
  function makeSupabaseBackend(url, key){
    var client = supabase.createClient(url, key);
    var uid;
    try{ uid = localStorage.getItem('meme_uid'); if(!uid){ uid = 'u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('meme_uid', uid); } }
    catch(e){ uid = 'u_'+Math.random().toString(36).slice(2,12); }
    var channel=null, isHost=false, subscribed=false, pendingTrack=false, room=null, cb=null, memes={}, pendingName='';

    function snap(){ if(!room) return null; var r=JSON.parse(JSON.stringify(room)); r.memes = JSON.parse(JSON.stringify(memes)); return r; }
    function emit(){ if(cb) cb(snap()); }
    function broadcast(){ if(channel && isHost){ channel.send({ type:'broadcast', event:'snapshot', payload: room }); } } // memes are sent as separate 'meme' events, not in the snapshot
    function sendAllMemes(){ if(!isHost || !channel) return; Object.keys(memes).forEach(function(i){ channel.send({ type:'broadcast', event:'meme', payload:{ i:+i, data: memes[i] } }); }); }
    function rebuildPlayers(){
      if(!isHost || !room || !channel) return;
      var st = channel.presenceState(), pl = {};
      Object.keys(st).forEach(function(k){ (st[k]||[]).forEach(function(p){ if(p && p.uid){ pl[p.uid] = { joinedAt: p.joinedAt || 0, name: p.name || '' }; } }); });
      room.players = pl; broadcast(); emit();
    }
    function applyVote(p){
      if(!isHost || !room || !p) return;
      room.votes = room.votes || {}; room.votes[p.roundIdx] = room.votes[p.roundIdx] || {}; room.votes[p.roundIdx][p.uid] = p.name;
      broadcast(); emit();
    }
    function ensureChannel(code){
      if(channel) return;
      channel = client.channel('memevote-'+code, { config: { broadcast: { self:false }, presence: { key: uid } } });
      channel.on('broadcast', { event:'snapshot' }, function(m){ if(!isHost){ room = m.payload || null; emit(); } });
      channel.on('broadcast', { event:'meme' }, function(m){ if(m.payload){ memes[m.payload.i] = m.payload.data; emit(); } });
      channel.on('broadcast', { event:'vote' }, function(m){ applyVote(m.payload); });
      channel.on('broadcast', { event:'request' }, function(){ if(isHost){ broadcast(); sendAllMemes(); } });
      channel.on('presence', { event:'sync' }, function(){ rebuildPlayers(); });
      channel.on('presence', { event:'join' }, function(){ rebuildPlayers(); if(isHost){ broadcast(); sendAllMemes(); } });
      channel.on('presence', { event:'leave' }, function(){ rebuildPlayers(); });
      channel.subscribe(function(status){
        if(status!=='SUBSCRIBED') return;
        subscribed = true;
        if(isHost){ broadcast(); sendAllMemes(); } else channel.send({ type:'broadcast', event:'request', payload:{} });
        if(pendingTrack){ pendingTrack=false; channel.track({ uid:uid, joinedAt: Date.now(), name: pendingName }); }
      });
    }
    return {
      ready: Promise.resolve({ uid: uid }), get uid(){ return uid; },
      exists: function(){ return Promise.resolve(true); }, // optimistic; UI shows "waiting for host"
      create: function(code, m){ isHost=true; room={ meta:m, players:{}, votes:{}, questions:null }; ensureChannel(code); emit(); return Promise.resolve(); },
      setQuestions: function(code, qs){ if(room){ room.questions = qs || null; broadcast(); emit(); } return Promise.resolve(); },
      watch: function(code, callback){ cb=callback; ensureChannel(code); emit(); return function(){ if(channel){ try{ client.removeChannel(channel); }catch(e){} } channel=null; subscribed=false; }; },
      join: function(code, name){ ensureChannel(code); pendingName = name||''; if(subscribed){ channel.track({ uid:uid, joinedAt: Date.now(), name: pendingName }); channel.send({ type:'broadcast', event:'request', payload:{} }); } else { pendingTrack=true; } return Promise.resolve(); },
      leave: function(){ if(channel){ try{ channel.untrack(); }catch(e){} } return Promise.resolve(); },
      setMeta: function(code, patch){ if(room && isHost){ Object.assign(room.meta, patch); broadcast(); emit(); } return Promise.resolve(); },
      vote: function(code, i, name){ if(channel){ channel.send({ type:'broadcast', event:'vote', payload:{ uid:uid, roundIdx:i, name:name } }); } return Promise.resolve(); },
      clearVotes: function(code){ if(room && isHost){ room.votes={}; broadcast(); emit(); } return Promise.resolve(); },
      setMeme: function(i, data){ memes[i]=data; if(isHost && channel){ channel.send({ type:'broadcast', event:'meme', payload:{ i:+i, data:data } }); } emit(); return Promise.resolve(); },
      getMemes: function(){ return memes; }
    };
  }

  // --------------------------------------------------------------------- init
  function init(){
    var params=new URLSearchParams(location.search);
    var roomParam=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    var okConfig = SUPABASE_URL && SUPABASE_URL.indexOf('REPLACE')<0 && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf('REPLACE')<0 && typeof supabase!=='undefined';
    if(window.__memeBackend){ backend=window.__memeBackend; state.configured=true; }
    else if(okConfig){ backend=makeSupabaseBackend(SUPABASE_URL, SUPABASE_ANON_KEY); state.configured=true; }
    else { state.configured=false; state.connecting=false; render(); return; }
    var savedName=''; try{ savedName=localStorage.getItem('meme_name')||''; }catch(e){}
    if(savedName) state.playerName=savedName;
    if(roomParam){ state.view='phone'; state.joinCode=roomParam; state.playerMode=true; state.fromLink=true; }
    render();
    backend.ready.then(function(r){
      state.uid=r.uid; state.connecting=false; render();   // show the name-entry join screen; the player joins after entering a name
    }).catch(function(e){ state.connecting=false; state.error=(e&&e.message)||'Connection failed'; render(); });
  }
  init();
})();
</script>
